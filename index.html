<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1on1 예약 — WOORHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --border: #DDDBD4;
    --border-strong: #C4C2BB;
    --text-primary: #1A1916;
    --text-secondary: #706E67;
    --text-tertiary: #A8A69F;
    --accent: #1A1916;
    --accent-fg: #F5F3EE;
    --booked-bg: #EEF5EE;
    --booked-border: #B6D9B6;
    --booked-text: #2D6A2D;
    --danger: #C0392B;
    --mono: 'DM Mono', monospace;
    --sans: 'Pretendard', -apple-system, sans-serif;
  }
  body { background: var(--bg); font-family: var(--sans); color: var(--text-primary); min-height: 100vh; }

  header {
    background: var(--accent);
    color: var(--accent-fg);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; opacity: 0.9; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .admin-badge {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    background: none;
  }
  .admin-badge:hover { border-color: rgba(255,255,255,0.6); color: rgba(255,255,255,0.9); }
  .admin-badge.active { background: var(--accent-fg); color: var(--accent); border-color: var(--accent-fg); }

  .refresh-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.5);
    background: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .refresh-btn:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.5); }

  main { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .page-title { margin-bottom: 2rem; }
  .page-title h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .page-title p { margin-top: 6px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

  .stats-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 2rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
  .stat-num { font-family: var(--mono); font-size: 26px; font-weight: 500; }
  .stat-label { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }

  .admin-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: none; }
  .admin-panel.open { display: block; }
  .admin-panel-title { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 1rem; }
  .slot-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
  .form-group input {
    font-family: var(--mono);
    font-size: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus { border-color: var(--border-strong); }
  input[type="date"] { width: 150px; }
  input[type="time"] { width: 110px; }
  .label-input { width: 160px; }

  .btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn:hover { background: var(--bg); border-color: var(--border-strong); }
  .btn-dark { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn-dark:hover { opacity: 0.82; background: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .date-group { margin-bottom: 1.5rem; }
  .date-heading {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    padding: 0 4px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .slot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
    transition: border-color 0.15s, opacity 0.2s;
  }
  .slot-card:hover { border-color: var(--border-strong); }
  .slot-card.booked { background: var(--booked-bg); border-color: var(--booked-border); }
  .slot-card.loading { opacity: 0.5; pointer-events: none; }

  .slot-time-block { min-width: 90px; }
  .slot-time-main { font-family: var(--mono); font-size: 18px; font-weight: 500; line-height: 1; }
  .slot-time-end { font-family: var(--mono); font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
  .slot-label-text { flex: 1; font-size: 13px; color: var(--text-secondary); }
  .slot-action { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .name-input {
    font-family: var(--sans);
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-primary);
    width: 120px;
    outline: none;
    transition: border-color 0.15s;
  }
  .name-input:focus { border-color: var(--border-strong); }

  .book-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .book-btn:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .booked-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--booked-text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .booked-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--booked-text); flex-shrink: 0; }

  .cancel-btn { font-size: 12px; color: var(--text-tertiary); background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: color 0.15s; }
  .cancel-btn:hover { color: var(--danger); }
  .delete-btn { font-size: 11px; color: var(--text-tertiary); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 4px; opacity: 0.45; transition: all 0.15s; }
  .delete-btn:hover { opacity: 1; color: var(--danger); }

  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-tertiary); }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  .loading-state { text-align: center; padding: 3rem 1rem; color: var(--text-tertiary); font-size: 14px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--text-secondary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .export-bar { margin-top: 2rem; display: flex; justify-content: flex-end; gap: 8px; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 20px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .pw-modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .pw-modal-bg.open { display: flex; }
  .pw-modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 2rem;
    width: 320px;
    border: 1px solid var(--border);
  }
  .pw-modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .pw-modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .pw-input {
    width: 100%;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    margin-bottom: 12px;
    font-family: var(--mono);
    letter-spacing: 0.15em;
  }
  .pw-input:focus { border-color: var(--border-strong); }
  .pw-btns { display: flex; gap: 8px; }
  .pw-btns button { flex: 1; }
  .pw-error { font-size: 12px; color: var(--danger); margin-top: -6px; margin-bottom: 10px; display: none; }

  @media (max-width: 560px) {
    .slot-card { flex-wrap: wrap; }
    .slot-action { width: 100%; justify-content: flex-end; }
    .slot-form { flex-direction: column; }
    input[type="date"], input[type="time"], .label-input { width: 100%; }
    header { padding: 0 1rem; }
    main { padding: 1.5rem 1rem 3rem; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">WOORHI · 1on1</span>
  <div class="header-right">
    <button class="refresh-btn" onclick="loadSlots()">↻ 새로고침</button>
    <button class="admin-badge" id="adminToggle" onclick="handleAdminClick()">관리자 모드</button>
  </div>
</header>

<div class="pw-modal-bg" id="pwModal">
  <div class="pw-modal">
    <h2>관리자 확인</h2>
    <p>슬롯 추가/삭제는 관리자만 가능합니다.</p>
    <input type="password" class="pw-input" id="pwInput" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkPw()" />
    <p class="pw-error" id="pwError">비밀번호가 틀렸습니다.</p>
    <div class="pw-btns">
      <button class="btn" onclick="closePwModal()">취소</button>
      <button class="btn btn-dark" onclick="checkPw()">확인</button>
    </div>
  </div>
</div>

<main>
  <div class="page-title">
    <h1>1on1 예약</h1>
    <p>원하는 시간대에 이름을 입력해 예약하세요. 슬롯당 1명, 선착순입니다.</p>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">전체</div></div>
    <div class="stat"><div class="stat-num" id="statBooked">0</div><div class="stat-label">예약됨</div></div>
    <div class="stat"><div class="stat-num" id="statRemain">0</div><div class="stat-label">남은 슬롯</div></div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-panel-title">슬롯 추가</div>
    <div class="slot-form">
      <div class="form-group">
        <label>날짜</label>
        <input type="date" id="inputDate" />
      </div>
      <div class="form-group">
        <label>시작 시간</label>
        <input type="time" id="inputTime" />
      </div>
      <div class="form-group">
        <label>메모 (선택)</label>
        <input type="text" class="label-input" id="inputLabel" placeholder="예: 영업팀 전용" />
      </div>
      <button class="btn btn-dark" id="addBtn" onclick="addSlot()">+ 슬롯 추가</button>
    </div>
  </div>

  <div id="slotContainer"><div class="loading-state"><div class="spinner"></div><br>슬롯 불러오는 중...</div></div>

  <div class="export-bar" id="exportBar" style="display:none;">
    <button class="btn" onclick="copyResult()">결과 복사</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbzpdg9fWrmy5gO6tACYz_6RFNO3XZ-q6UqBf96v5qYr-Rd3rfl52H6G7oK8GtFEHNJTsw/exec';
  const ADMIN_PW = '1234';
  const DURATION = 30;

  let slots = [];
  let adminMode = false;

  async function api(params) {
    const url = new URL(API);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return res.json();
  }

  async function loadSlots() {
    document.getElementById('slotContainer').innerHTML = '<div class="loading-state"><div class="spinner"></div><br>슬롯 불러오는 중...</div>';
    try {
      const data = await api({ action: 'getSlots' });
      slots = (data.slots || []).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
      render();
    } catch(e) {
      document.getElementById('slotContainer').innerHTML = '<div class="empty-state"><p>데이터를 불러오지 못했습니다.<br>잠시 후 새로고침 해주세요.</p></div>';
    }
  }

  async function addSlot() {
    const date = document.getElementById('inputDate').value;
    const time = document.getElementById('inputTime').value;
    const label = document.getElementById('inputLabel').value.trim();
    if (!date || !time) { showToast('날짜와 시간을 입력해주세요.'); return; }
    const btn = document.getElementById('addBtn');
    btn.disabled = true; btn.textContent = '추가 중...';
    try {
      const res = await api({ action: 'addSlot', date, time, label });
      if (res.error) { showToast(res.error === '중복 슬롯' ? '이미 같은 시간 슬롯이 있습니다.' : res.error); }
      else { document.getElementById('inputLabel').value = ''; showToast('슬롯이 추가됐습니다.'); await loadSlots(); }
    } catch(e) { showToast('오류가 발생했습니다.'); }
    btn.disabled = false; btn.textContent = '+ 슬롯 추가';
  }

  async function book(id) {
    const input = document.getElementById('ni_' + id);
    const name = input ? input.value.trim() : '';
    if (!name) { if (input) input.focus(); return; }
    const card = document.getElementById('card_' + id);
    if (card) card.classList.add('loading');
    try {
      const res = await api({ action: 'book', id, name });
      if (res.error === '이미 예약됨') { showToast('방금 다른 분이 예약했습니다. 다른 시간을 선택해주세요.'); await loadSlots(); }
      else if (res.error) { showToast(res.error); if (card) card.classList.remove('loading'); }
      else { showToast(name + '님 예약 완료! 캘린더에 등록됐습니다.'); await loadSlots(); }
    } catch(e) { showToast('오류가 발생했습니다.'); if (card) card.classList.remove('loading'); }
  }

  async function cancel(id) {
    const slot = slots.find(s => s.id === id);
    const card = document.getElementById('card_' + id);
    if (card) card.classList.add('loading');
    try {
      const res = await api({ action: 'cancel', id });
      if (res.success) { showToast((slot ? slot.booked : '') + '님 예약 취소'); await loadSlots(); }
      else { showToast('오류가 발생했습니다.'); if (card) card.classList.remove('loading'); }
    } catch(e) { showToast('오류가 발생했습니다.'); if (card) card.classList.remove('loading'); }
  }

  async function deleteSlot(id) {
    const card = document.getElementById('card_' + id);
    if (card) card.classList.add('loading');
    try {
      const res = await api({ action: 'deleteSlot', id });
      if (res.success) { showToast('슬롯 삭제됨'); await loadSlots(); }
      else { showToast('오류가 발생했습니다.'); if (card) card.classList.remove('loading'); }
    } catch(e) { showToast('오류가 발생했습니다.'); if (card) card.classList.remove('loading'); }
  }

  function handleAdminClick() {
    if (adminMode) { adminMode = false; document.getElementById('adminToggle').classList.remove('active'); document.getElementById('adminPanel').classList.remove('open'); render(); }
    else { document.getElementById('pwModal').classList.add('open'); setTimeout(() => document.getElementById('pwInput').focus(), 50); }
  }

  function checkPw() {
    const val = document.getElementById('pwInput').value;
    if (val === ADMIN_PW) {
      closePwModal();
      adminMode = true;
      document.getElementById('adminToggle').classList.add('active');
      document.getElementById('adminPanel').classList.add('open');
      render();
    } else {
      document.getElementById('pwError').style.display = 'block';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  function closePwModal() {
    document.getElementById('pwModal').classList.remove('open');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').style.display = 'none';
  }

  function addTime(t, min) {
    const [h, m] = t.split(':').map(Number);
    const total = h * 60 + m + min;
    return String(Math.floor(total/60)%24).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
  }

  function formatDate(dateStr) {
    const [y,mo,d] = dateStr.split('-').map(Number);
    const days = ['일','월','화','수','목','금','토'];
    return `${mo}월 ${d}일 (${days[new Date(y,mo-1,d).getDay()]})`;
  }

  function groupByDate(arr) {
    const map = {};
    arr.forEach(s => { if (!map[s.date]) map[s.date] = []; map[s.date].push(s); });
    return map;
  }

  function render() {
    const container = document.getElementById('slotContainer');
    const statsBar = document.getElementById('statsBar');
    const exportBar = document.getElementById('exportBar');

    if (slots.length === 0) {
      statsBar.style.display = 'none';
      exportBar.style.display = 'none';
      container.innerHTML = '<div class="empty-state"><div class="icon">◻</div><p>아직 슬롯이 없습니다.<br>관리자 모드에서 1on1 시간을 추가해주세요.</p></div>';
      return;
    }

    statsBar.style.display = 'grid';
    exportBar.style.display = 'flex';
    const booked = slots.filter(s => s.booked).length;
    document.getElementById('statTotal').textContent = slots.length;
    document.getElementById('statBooked').textContent = booked;
    document.getElementById('statRemain').textContent = slots.length - booked;

    const groups = groupByDate(slots);
    let html = '';
    Object.keys(groups).sort().forEach(date => {
      html += `<div class="date-group"><div class="date-heading">${formatDate(date)}</div>`;
      groups[date].forEach(s => {
        const end = addTime(s.time, DURATION);
        if (s.booked) {
          html += `
            <div class="slot-card booked" id="card_${s.id}">
              <div class="slot-time-block">
                <div class="slot-time-main">${s.time}</div>
                <div class="slot-time-end">— ${end}</div>
              </div>
              <div class="slot-label-text">${s.label || ''}</div>
              <div class="slot-action">
                <span class="booked-name"><span class="booked-dot"></span>${s.booked}</span>
                <button class="cancel-btn" onclick="cancel('${s.id}')">취소</button>
                ${adminMode ? `<button class="delete-btn" onclick="deleteSlot('${s.id}')">삭제</button>` : ''}
              </div>
            </div>`;
        } else {
          html += `
            <div class="slot-card" id="card_${s.id}">
              <div class="slot-time-block">
                <div class="slot-time-main">${s.time}</div>
                <div class="slot-time-end">— ${end}</div>
              </div>
              <div class="slot-label-text">${s.label || ''}</div>
              <div class="slot-action">
                <input class="name-input" id="ni_${s.id}" type="text" placeholder="이름 입력"
                  onkeydown="if(event.key==='Enter') book('${s.id}')" />
                <button class="book-btn" onclick="book('${s.id}')">예약</button>
                ${adminMode ? `<button class="delete-btn" onclick="deleteSlot('${s.id}')">삭제</button>` : ''}
              </div>
            </div>`;
        }
      });
      html += '</div>';
    });
    container.innerHTML = html;
  }

  function copyResult() {
    const booked = slots.filter(s => s.booked);
    if (!booked.length) { showToast('예약된 슬롯이 없습니다.'); return; }
    let text = '[1on1 예약 현황]\n';
    const groups = groupByDate(booked);
    Object.keys(groups).sort().forEach(date => {
      text += `\n${formatDate(date)}\n`;
      groups[date].forEach(s => { text += `  ${s.time}–${addTime(s.time,DURATION)}  ${s.booked}\n`; });
    });
    navigator.clipboard.writeText(text).then(() => showToast('클립보드에 복사됐습니다.')).catch(() => showToast('복사 실패'));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  loadSlots();
</script>
</body>
</html>
